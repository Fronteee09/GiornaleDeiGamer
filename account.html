<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account · Giornale Dei Gamer</title>
<link rel="icon" href="logo2.jpg">
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: #e0f2fe;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: url('img/sfondominecraft1.png') no-repeat center center fixed;
    background-size: cover;
    background-color: #0c4a6e;
    padding: 20px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: rgba(12, 74, 110, 0.85);
    border: 1px solid rgba(125, 211, 252, 0.45);
    border-radius: 16px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(224, 242, 254, 0.5);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    padding: 30px;
    text-align: center;
  }

  h1 {
    margin: 0 0 10px;
    font-size: 2rem;
    color: #ffffff;
    text-shadow: 0 0 16px rgba(56, 189, 248, 0.9);
  }

  p {
    color: #bae6fd;
    font-size: 0.95rem;
    margin-bottom: 24px;
  }

  .input-group {
    margin-bottom: 16px;
    text-align: left;
  }

  label {
    display: block;
    font-size: 0.85rem;
    color: #7dd3fc;
    margin-bottom: 6px;
    font-weight: 600;
  }

  .input-field {
    width: 100%;
    padding: 12px 16px;
    border-radius: 8px;
    border: 1px solid #7dd3fc;
    background: rgba(255, 255, 255, 0.95);
    color: #0f172a;
    font-size: 1rem;
    outline: none;
  }

  .action-btn {
    width: 100%;
    padding: 12px;
    border-radius: 999px;
    border: 1px solid #7dd3fc;
    background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
    color: white;
    font-weight: bold;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: 0 0 14px rgba(56, 189, 248, 0.5);
    margin-top: 10px;
    transition: all 0.2s ease;
  }

  .action-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 18px rgba(56, 189, 248, 0.8);
  }

  .toggle-link {
    margin-top: 16px;
    font-size: 0.9rem;
    color: #bae6fd;
    cursor: pointer;
    text-decoration: underline;
  }

  .toggle-link:hover {
    color: #ffffff;
  }

  .error-msg {
    color: #fca5a5;
    font-size: 0.85rem;
    margin-top: 10px;
    font-weight: 600;
  }

  .success-msg {
    color: #86efac;
    font-size: 0.85rem;
    margin-top: 10px;
    font-weight: 600;
  }

  /* Sezione utente loggato */
  #loggedSection {
    display: none;
  }

  .user-avatar {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #7dd3fc;
    margin: 0 auto 16px;
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
  }

  .back-link {
    display: inline-block;
    margin-top: 20px;
    color: #7dd3fc;
    text-decoration: none;
    font-size: 0.9rem;
  }

  .back-link:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

<div class="card">
  
  <!-- Form di Autenticazione (Login / Registrazione) -->
  <div id="authFormContainer">
    <h1 id="formTitle">Accedi</h1>
    <p id="formSubtitle">Gestisci il tuo profilo su Giornale Dei Gamer</p>

    <div class="input-group">
      <label for="username">Nickname</label>
      <input type="text" id="username" class="input-field" placeholder="Inserisci il tuo nickname...">
    </div>

    <div class="input-group">
      <label for="password">Password</label>
      <input type="password" id="password" class="input-field" placeholder="Inserisci la password...">
    </div>

    <button class="action-btn" id="submitBtn" onclick="handleAuth()">Accedi</button>
    
    <div id="messageBox"></div>

    <div class="toggle-link" id="toggleModeBtn" onclick="toggleAuthMode()">
      Non hai un account? Registrati
    </div>
  </div>

  <!-- Area Utente Loggato -->
  <div id="loggedSection">
    <img id="userAvatarImg" class="user-avatar" src="logo2.jpg" alt="Avatar utente" onerror="this.src='logo2.jpg'">
    <h1 id="loggedUsername">Bentornato!</h1>
    <p>Sei correttamente autenticato.</p>

    <!-- Pannello Admin visibile solo per Fronte -->
    <div id="adminPanel" style="display:none; margin-top: 15px; padding: 12px; background: rgba(2, 132, 199, 0.3); border-radius: 8px; border: 1px dashed #7dd3fc;">
      <p style="margin: 0 0 8px; font-size: 0.85rem; color: #ffffff; font-weight: bold;">🛠️ Pannello Admin (Fronte)</p>
      <input type="text" id="adminTargetUser" class="input-field" placeholder="Nickname utente da modificare" style="margin-bottom: 6px; font-size: 0.85rem; padding: 8px;">
      <input type="text" id="adminNewAvatar" class="input-field" placeholder="Nuovo URL immagine profilo" style="margin-bottom: 8px; font-size: 0.85rem; padding: 8px;">
      <button class="action-btn" onclick="adminChangeAvatar()" style="padding: 8px; font-size: 0.85rem; margin-top:0;">Aggiorna Avatar Utente</button>
    </div>

    <button class="action-btn" onclick="logout()" style="background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%); border-color: #fca5a5; margin-top: 15px;">Esci dall'account</button>
  </div>

  <a class="back-link" href="index.html">← Torna alla Home</a>

</div>

<script>
  let isRegistering = false;

  // Controlla lo stato all'avvio della pagina
  window.addEventListener('DOMContentLoaded', () => {
    checkLoggedState();
  });

  // Cambia tra Login e Registrazione
  function toggleAuthMode() {
    isRegistering = !isRegistering;
    const title = document.getElementById('formTitle');
    const subtitle = document.getElementById('formSubtitle');
    const btn = document.getElementById('submitBtn');
    const toggleLink = document.getElementById('toggleModeBtn');
    
    document.getElementById('messageBox').innerHTML = '';

    if (isRegistering) {
      title.textContent = "Registrati";
      subtitle.textContent = "Crea un nuovo account gamer";
      btn.textContent = "Crea Account";
      toggleLink.textContent = "Hai già un account? Accedi";
    } else {
      title.textContent = "Accedi";
      subtitle.textContent = "Gestisci il tuo profilo su Giornale Dei Gamer";
      btn.textContent = "Accedi";
      toggleLink.textContent = "Non hai un account? Registrati";
    }
  }

  // Gestione Login / Registrazione
  function handleAuth() {
    const usernameInput = document.getElementById('username').value.trim();
    const passwordInput = document.getElementById('password').value.trim();
    const messageBox = document.getElementById('messageBox');

    messageBox.innerHTML = '';

    if (!usernameInput || !passwordInput) {
      messageBox.innerHTML = '<div class="error-msg">Compila tutti i campi!</div>';
      return;
    }

    const userKey = 'gdg_user_' + usernameInput.toLowerCase();

    if (isRegistering) {
      // Eccezione: se il nome utente è 'fronte', permettiamo la registrazione/sovrascrizione senza blocchi
      if (localStorage.getItem(userKey) && usernameInput.toLowerCase() !== 'fronte') {
        messageBox.innerHTML = '<div class="error-msg">Questo nome utente esiste già!</div>';
        return;
      }

      // Salva utente
      const userData = {
        username: usernameInput,
        password: passwordInput,
        avatar: 'logo2.jpg'
      };
      localStorage.setItem(userKey, JSON.stringify(userData));
      localStorage.setItem('gdg_logged_user', usernameInput);

      messageBox.innerHTML = '<div class="success-msg">Registrazione completata! Accesso in corso...</div>';
      setTimeout(() => { checkLoggedState(); }, 1000);

    } else {
      // Login
      const savedDataJson = localStorage.getItem(userKey);
      if (!savedDataJson) {
        messageBox.innerHTML = '<div class="error-msg">Utente non trovato! Registrati prima.</div>';
        return;
      }

      const savedData = JSON.parse(savedDataJson);
      if (savedData.password !== passwordInput) {
        messageBox.innerHTML = '<div class="error-msg">Password errata!</div>';
        return;
      }

      localStorage.setItem('gdg_logged_user', savedData.username);
      messageBox.innerHTML = '<div class="success-msg">Accesso riuscito! Reindirizzamento...</div>';
      setTimeout(() => { checkLoggedState(); }, 800);
    }
  }

  // Controlla se c'è un utente loggato nel localStorage
  function checkLoggedState() {
    const loggedUser = localStorage.getItem('gdg_logged_user');
    const authContainer = document.getElementById('authFormContainer');
    const loggedSection = document.getElementById('loggedSection');

    if (loggedUser) {
      authContainer.style.display = 'none';
      loggedSection.style.display = 'block';

      document.getElementById('loggedUsername').textContent = loggedUser;

      // Carica avatar personalizzato se presente
      const userKey = 'gdg_user_' + loggedUser.toLowerCase();
      const userDataJson = localStorage.getItem(userKey);
      if (userDataJson) {
        const userData = JSON.parse(userDataJson);
        if (userData.avatar) {
          document.getElementById('userAvatarImg').src = userData.avatar;
        }
      }

      // Mostra pannello admin se l'utente è Fronte
      if (loggedUser.toLowerCase() === 'fronte') {
        document.getElementById('adminPanel').style.display = 'block';
      }
    } else {
      authContainer.style.display = 'block';
      loggedSection.style.display = 'none';
    }
  }

  // Funzione Admin per cambiare l'avatar di qualsiasi utente
  function adminChangeAvatar() {
    const targetName = document.getElementById('adminTargetUser').value.trim();
    const newAvatarUrl = document.getElementById('adminNewAvatar').value.trim();

    if (!targetName || !newAvatarUrl) {
      alert("Inserisci sia il nickname che il nuovo URL dell'immagine!");
      return;
    }

    const userKey = 'gdg_user_' + targetName.toLowerCase();
    const userDataJson = localStorage.getItem(userKey);

    if (!userDataJson) {
      alert("Utente non trovato nel database locale!");
      return;
    }

    let userData = JSON.parse(userDataJson);
    userData.avatar = newAvatarUrl;
    localStorage.setItem(userKey, JSON.stringify(userData));

    alert(`Avatar aggiornato con successo per l'utente ${targetName}!`);
    document.getElementById('adminTargetUser').value = '';
    document.getElementById('adminNewAvatar').value = '';
  }

  // Logout
  function logout() {
    localStorage.removeItem('gdg_logged_user');
    document.getElementById('username').value = '';
    document.getElementById('password').value = '';
    document.getElementById('messageBox').innerHTML = '';
    checkLoggedState();
  }
</script>

</body>
</html>
