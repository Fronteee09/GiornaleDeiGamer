<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account · Giornale Dei Gamer</title>
<link rel="icon" href="logo2.jpg">
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: #e0f2fe;
    line-height: 1.6;
    overflow-x: hidden;
    background:
      radial-gradient(circle at 15% 8%, rgba(56, 189, 248, 0.35), transparent 38%),
      radial-gradient(circle at 90% 35%, rgba(14, 165, 233, 0.35), transparent 42%),
      radial-gradient(circle at 50% 85%, rgba(3, 105, 161, 0.25), transparent 50%),
      linear-gradient(160deg, #0284c7 0%, #0369a1 50%, #075985 100%);
    background-attachment: fixed;
  }

  .wrap { 
    width: 100%; 
    max-width: 500px; 
    margin: 0 auto; 
    padding: 18px; 
  }

  .glass {
    background: linear-gradient(180deg, rgba(186, 230, 253, 0.22), rgba(12, 74, 110, 0.45));
    border: 1px solid rgba(125, 211, 252, 0.45);
    border-radius: 16px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(224, 242, 254, 0.5);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    padding: 24px;
    margin-bottom: 18px;
    text-align: center;
  }

  header.glass { 
    margin-top: 24px; 
    padding: 24px 20px; 
  }

  h1 {
    margin: 0 0 6px;
    font-size: clamp(1.8rem, 7vw, 2.4rem);
    color: #ffffff;
    text-shadow: 0 0 16px rgba(56, 189, 248, 0.9);
  }

  p { margin: 0; color: #bae6fd; font-size: 0.95rem; }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 16px;
  }

  .input-field {
    width: 100%;
    padding: 12px 16px;
    border-radius: 999px;
    border: 1px solid #7dd3fc;
    background: rgba(255, 255, 255, 0.9);
    color: #0f172a;
    font-size: 0.95rem;
    outline: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }

  .input-field:focus {
    border-color: #ffffff;
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
  }

  .profile-img {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 50%;
    border: 2px solid #7dd3fc;
    box-shadow: 0 0 16px rgba(56, 189, 248, 0.6);
    margin: 0 auto 14px;
    background-color: #0c4a6e;
  }

  .btn {
    width: 100%;
    min-height: 44px;
    padding: 10px 20px;
    color: #ffffff;
    font-weight: 600;
    text-align: center;
    border: 1px solid #7dd3fc;
    border-radius: 999px;
    background: linear-gradient(180deg, #38bdf8 0%, #0284c7 50%, #0369a1 51%, #0284c7 100%);
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 16px rgba(56, 189, 248, 0.8);
  }

  .toggle-link {
    margin-top: 14px;
    font-size: 0.9rem;
    color: #bae6fd;
    cursor: pointer;
    text-decoration: underline;
  }

  .toggle-link:hover { color: #ffffff; }

  .back-container {
    text-align: center;
    margin-top: 10px;
    margin-bottom: 20px;
  }

  .btn-back {
    display: inline-block;
    padding: 10px 24px;
    color: #ffffff;
    font-weight: 600;
    text-decoration: none;
    border: 1px solid rgba(125, 211, 252, 0.4);
    border-radius: 999px;
    background: rgba(12, 74, 110, 0.6);
  }

  .error-msg {
    color: #fca5a5;
    font-size: 0.85rem;
    margin-top: 8px;
  }

  footer { 
    text-align: center; 
    color: #7dd3fc; 
    font-size: .9rem; 
    padding: 10px 0 30px; 
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="glass">
    <h1 id="formTitle">Accedi</h1>
    <p id="formSubtitle">Inserisci le tue credenziali per entrare</p>
  </header>

  <!-- Form Login / Registrazione -->
  <div class="glass" id="authBox">
    <div class="form-group">
      <input type="text" id="usernameInput" class="input-field" placeholder="Nome utente (Nickname)" required>
      <input type="password" id="passwordInput" class="input-field" placeholder="Password" required>
      <button class="btn" id="actionBtn" onclick="handleAuth()">Accedi</button>
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <div class="toggle-link" id="toggleModeBtn" onclick="toggleMode()">Non hai un account? Registrati</div>
  </div>

  <!-- Profilo Utente / Pannello Admin -->
  <div class="glass" id="profileBox" style="display: none;">
    <img id="userImgDisplay" class="profile-img" src="logo2.jpg" alt="Immagine profilo">
    <h2>Benvenuto, <span id="userNicknameDisplay"></span>!</h2>
    <p style="margin-top: 4px; margin-bottom: 16px;">Sei connesso al tuo account locale.</p>
    
    <div class="form-group">
      <input type="text" id="newImgUrl" class="input-field" placeholder="Incolla il tuo nuovo URL immagine...">
      <button class="btn" onclick="updateProfileImage()">Aggiorna la mia immagine</button>
    </div>

    <!-- PANNELLO ADMIN (Visibile solo se ti logghi come "Fronte") -->
    <div id="adminPanel" style="display: none; margin-top: 24px; padding-top: 16px; border-top: 1px solid rgba(125, 211, 252, 0.4);">
      <h3 style="color: #ffffff; margin-bottom: 10px; font-size: 1.1rem; text-shadow: 0 0 10px rgba(56,189,248,0.6);">🛠️ Console Admin (Gestione Utenti)</h3>
      <div class="form-group">
        <input type="text" id="adminTargetUser" class="input-field" placeholder="Nome utente da modificare...">
        <input type="text" id="adminTargetImg" class="input-field" placeholder="Nuovo URL immagine per quell'utente...">
        <button class="btn" onclick="adminUpdateUserImage()" style="background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%); border-color: #fcd34d;">Forza Modifica Immagine Utente</button>
      </div>
    </div>

    <div class="form-group" style="margin-top: 16px;">
      <button class="btn" onclick="logoutUser()" style="background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%); border-color: #fca5a5;">Esci dall'account</button>
    </div>
  </div>

  <div class="back-container">
    <a class="btn-back" href="index.html">Torna alla Home</a>
  </div>

  <footer>Giornale Dei Gamer · Tutti i diritti riservati</footer>

</div>

<script>
  let isRegistering = false;

  function checkLoginState() {
    const loggedUser = localStorage.getItem('gdg_logged_user');
    const authBox = document.getElementById('authBox');
    const profileBox = document.getElementById('profileBox');
    const adminPanel = document.getElementById('adminPanel');

    if (loggedUser) {
      authBox.style.display = 'none';
      profileBox.style.display = 'block';

      const userData = JSON.parse(localStorage.getItem('gdg_user_' + loggedUser));
      document.getElementById('userNicknameDisplay').textContent = loggedUser;
      
      if (userData && userData.profileImg) {
        document.getElementById('userImgDisplay').src = userData.profileImg;
      }

      // Mostra la console admin se l'utente loggato è "Fronte"
      if (loggedUser.toLowerCase() === 'fronte') {
        adminPanel.style.display = 'block';
      } else {
        adminPanel.style.display = 'none';
      }
    } else {
      authBox.style.display = 'block';
      profileBox.style.display = 'none';
    }
  }

  function toggleMode() {
    isRegistering = !isRegistering;
    const title = document.getElementById('formTitle');
    const subtitle = document.getElementById('formSubtitle');
    const btn = document.getElementById('actionBtn');
    const toggleLink = document.getElementById('toggleModeBtn');
    document.getElementById('errorMsg').textContent = '';

    if (isRegistering) {
      title.textContent = "Registrati";
      subtitle.textContent = "Crea un nuovo account con nickname e password";
      btn.textContent = "Registrati";
      toggleLink.textContent = "Hai già un account? Accedi";
    } else {
      title.textContent = "Accedi";
      subtitle.textContent = "Inserisci le tue credenziali per entrare";
      btn.textContent = "Accedi";
      toggleLink.textContent = "Non hai un account? Registrati";
    }
  }

  function handleAuth() {
    const username = document.getElementById('usernameInput').value.trim();
    const password = document.getElementById('passwordInput').value.trim();
    const errorBox = document.getElementById('errorMsg');
    errorBox.textContent = '';

    if (!username || !password) {
      errorBox.textContent = "Compila tutti i campi!";
      return;
    }

    const userKey = 'gdg_user_' + username;

    if (isRegistering) {
      if (localStorage.getItem(userKey)) {
        errorBox.textContent = "Questo nome utente esiste già!";
        return;
      }

      const newUser = {
        password: password,
        profileImg: "logo2.jpg" // Immagine predefinita (favicon)
      };
      localStorage.setItem(userKey, JSON.stringify(newUser));
      localStorage.setItem('gdg_logged_user', username);
      alert("Registrazione completata con successo!");
    } else {
      const storedData = localStorage.getItem(userKey);
      if (!storedData) {
        errorBox.textContent = "Utente non trovato.";
        return;
      }

      const userData = JSON.parse(storedData);
      if (userData.password !== password) {
        errorBox.textContent = "Password errata.";
        return;
      }

      localStorage.setItem('gdg_logged_user', username);
    }

    document.getElementById('usernameInput').value = '';
    document.getElementById('passwordInput').value = '';
    checkLoginState();
  }

  function updateProfileImage() {
    const newUrl = document.getElementById('newImgUrl').value.trim();
    if (!newUrl) {
      alert("Inserisci un URL valido!");
      return;
    }

    const loggedUser = localStorage.getItem('gdg_logged_user');
    if (loggedUser) {
      const userKey = 'gdg_user_' + loggedUser;
      let userData = JSON.parse(localStorage.getItem(userKey));
      userData.profileImg = newUrl;
      localStorage.setItem(userKey, JSON.stringify(userData));

      document.getElementById('userImgDisplay').src = newUrl;
      document.getElementById('newImgUrl').value = '';
      alert("Immagine profilo aggiornata!");
    }
  }

  // Console Admin: Forza modifica immagine per qualsiasi utente
  function adminUpdateUserImage() {
    const targetUser = document.getElementById('adminTargetUser').value.trim();
    const newImg = document.getElementById('adminTargetImg').value.trim();

    if (!targetUser || !newImg) {
      alert("Inserisci sia il nome utente che il nuovo URL dell'immagine!");
      return;
    }

    const userKey = 'gdg_user_' + targetUser;
    const storedData = localStorage.getItem(userKey);

    if (!storedData) {
      alert("L'utente '" + targetUser + "' non esiste nel database locale!");
      return;
    }

    let userData = JSON.parse(storedData);
    userData.profileImg = newImg;
    localStorage.setItem(userKey, JSON.stringify(userData));

    document.getElementById('adminTargetUser').value = '';
    document.getElementById('adminTargetImg').value = '';
    alert("Successo! L'immagine del profilo di '" + targetUser + "' è stata modificata dalla console admin.");
  }

  function logoutUser() {
    localStorage.removeItem('gdg_logged_user');
    checkLoginState();
  }

  window.onload = checkLoginState;
</script>

</body>
</html>
