<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff · Giornale Dei Gamer</title>
<link rel="icon" href="logo2.jpg">
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: #e0f2fe;
    line-height: 1.6;
    overflow-x: hidden;
    background:
      radial-gradient(circle at 15% 8%, rgba(56, 189, 248, 0.35), transparent 38%),
      radial-gradient(circle at 90% 35%, rgba(14, 165, 233, 0.35), transparent 42%),
      radial-gradient(circle at 50% 85%, rgba(3, 105, 161, 0.25), transparent 50%),
      linear-gradient(160deg, #0284c7 0%, #0369a1 50%, #075985 100%);
    background-attachment: fixed;
  }

  .wrap { 
    width: 100%; 
    max-width: 760px; 
    margin: 0 auto; 
    padding: 18px; 
  }

  /* Effetto Vetro Aero / Glassmorphism Blue */
  .glass {
    background: linear-gradient(180deg, rgba(186, 230, 253, 0.22), rgba(12, 74, 110, 0.45));
    border: 1px solid rgba(125, 211, 252, 0.45);
    border-radius: 16px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(224, 242, 254, 0.5);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    padding: 20px;
    margin-bottom: 18px;
  }

  header.glass { 
    margin-top: 24px; 
    text-align: center; 
    padding: 36px 20px; 
  }

  h1 {
    margin: 0 0 10px;
    font-size: clamp(2rem, 9vw, 3.4rem);
    line-height: 1.1;
    color: #ffffff;
    text-shadow: 0 0 16px rgba(56, 189, 248, 0.9), 0 2px 4px rgba(0, 0, 0, 0.8);
  }

  header p { 
    margin: 0; 
    color: #bae6fd; 
    font-size: 1.1rem; 
  }

  h2 { 
    margin: 0 0 16px; 
    font-size: 1.35rem; 
    color: #ffffff; 
    text-shadow: 0 0 10px rgba(56, 189, 248, 0.6); 
    text-align: center;
  }

  .staff-grid { 
    display: grid; 
    gap: 16px; 
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
  }

  .staff-card {
    background: rgba(12, 74, 110, 0.55);
    border: 1px solid rgba(125, 211, 252, 0.35);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .staff-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(56, 189, 248, 0.3);
  }

  .staff-img {
    width: 110px;
    height: 110px;
    object-fit: cover;
    border-radius: 50%;
    border: 2px solid rgba(125, 211, 252, 0.8);
    box-shadow: 0 0 16px rgba(56, 189, 248, 0.6);
    margin-bottom: 12px;
    background-color: #0c4a6e;
  }

  .staff-card h3 { 
    margin: 0 0 4px; 
    font-size: 1.2rem; 
    color: #ffffff; 
  }

  .staff-role { 
    margin: 0 0 12px; 
    color: #38bdf8; 
    font-weight: 600;
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* Bottoni dello Staff e del Navigatore */
  .btn-small {
    display: inline-block;
    padding: 8px 18px;
    color: #ffffff;
    font-weight: 600;
    font-size: 0.85rem;
    text-decoration: none;
    text-shadow: 0 1px 2px rgba(0, 20, 40, 0.9);
    border: 1px solid #7dd3fc;
    border-radius: 999px;
    background: linear-gradient(180deg, #38bdf8 0%, #0284c7 50%, #0369a1 51%, #0284c7 100%);
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    transition: all 0.2s ease;
  }

  .btn-small:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 14px rgba(56, 189, 248, 0.6);
  }

  .back-container {
    text-align: center;
    margin-top: 10px;
    margin-bottom: 20px;
  }

  .btn {
    display: inline-block;
    min-height: 42px;
    padding: 10px 24px;
    color: #ffffff;
    font-weight: 600;
    text-decoration: none;
    text-shadow: 0 1px 2px rgba(0, 20, 40, 0.9);
    border: 1px solid #7dd3fc;
    border-radius: 999px;
    background: linear-gradient(180deg, #38bdf8 0%, #0284c7 50%, #0369a1 51%, #0284c7 100%);
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    transition: all 0.2s ease;
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 18px rgba(56, 189, 248, 0.7);
  }

  footer { 
    text-align: center; 
    color: #7dd3fc; 
    font-size: .9rem; 
    padding: 10px 0 30px; 
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="glass">
    <h1>Staff</h1>
    <p>Il team che gestisce e sviluppa Giornale Dei Gamer.</p>
  </header>

  <section class="glass">
    <h2>Membri dello Staff</h2>
    <div class="staff-grid">
      
      <!-- Fronte ★ -->
      <div class="staff-card">
        <div>
          <img class="staff-img" src="fronte.png" alt="Fronte ★" onerror="this.src='https://via.placeholder.com/110/0c4a6e/ffffff?text=Fronte'">
          <h3>Fronte ★</h3>
          <p class="staff-role">DEV</p>
        </div>
      </div>

      <!-- Kukilol13 -->
      <div class="staff-card">
        <div>
          <img class="staff-img" src="kukilol13.png" alt="Kukilol13" onerror="this.src='https://via.placeholder.com/110/0c4a6e/ffffff?text=Kukilol13'">
          <h3>Kukilol13</h3>
          <p class="staff-role">Owner</p>
        </div>
      </div>

      <!-- PrismSupport -->
      <div class="staff-card">
        <div>
          <img class="staff-img" src="prismsupport.png" alt="PrismSupport" onerror="this.src='https://via.placeholder.com/110/0c4a6e/ffffff?text=Prism'">
          <h3>PrismSupport</h3>
          <p class="staff-role">Support</p>
        </div>
        <a class="btn-small" href="prismsupportsocial.html">Visualizza profilo</a>
      </div>

    </div>
  </section>

  <div class="back-container">
    <a class="btn" href="index.html">Torna alla Home</a>
  </div>

  <footer>Giornale Dei Gamer · Tutti i diritti riservati</footer>

</div>
</body>
</html>
