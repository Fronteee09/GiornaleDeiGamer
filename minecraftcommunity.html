<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minecraft Community · Giornale Dei Gamer</title>
<link rel="icon" href="logo2.jpg">
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: #e0f2fe;
    line-height: 1.6;
    overflow-x: hidden;
    background: linear-gradient(135deg, #0f172a 0%, #0c4a6e 100%);
  }

  .wrap { 
    width: 100%; 
    max-width: 760px; 
    margin: 0 auto; 
    padding: 18px; 
  }

  .glass {
    background: rgba(12, 74, 110, 0.75);
    border: 1px solid rgba(125, 211, 252, 0.45);
    border-radius: 16px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(224, 242, 254, 0.5);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    padding: 20px;
    margin-bottom: 18px;
  }

  header.glass { 
    margin-top: 24px; 
    text-align: center; 
    padding: 30px 20px; 
  }

  h1 {
    margin: 0 0 10px;
    font-size: clamp(1.8rem, 7vw, 2.8rem);
    line-height: 1.1;
    color: #ffffff;
    text-shadow: 0 0 16px rgba(56, 189, 248, 0.9), 0 2px 4px rgba(0, 0, 0, 0.8);
  }

  header p { 
    margin: 0; 
    color: #bae6fd; 
    font-size: 1.05rem; 
  }

  /* Form creazione Post */
  .add-post-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(125, 211, 252, 0.3);
  }

  .input-field {
    width: 100%;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid #7dd3fc;
    background: rgba(255, 255, 255, 0.95);
    color: #0f172a;
    font-size: 0.95rem;
    outline: none;
  }

  textarea.input-field {
    resize: vertical;
    min-height: 70px;
  }

  .submit-btn {
    align-self: flex-start;
    padding: 8px 20px;
    border-radius: 999px;
    border: 1px solid #7dd3fc;
    background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
    color: white;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    transition: all 0.2s ease;
  }

  .submit-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 14px rgba(56, 189, 248, 0.7);
  }

  .search-container {
    margin-bottom: 16px;
  }

  .search-input {
    width: 100%;
    padding: 12px 18px;
    border-radius: 999px;
    border: 1px solid #ffffff;
    background: #ffffff;
    color: #0f172a;
    font-size: 0.95rem;
    outline: none;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
  }

  .scroll-box {
    max-height: 550px;
    overflow-y: auto;
    padding-right: 6px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .post-card {
    background: rgba(7, 59, 92, 0.85);
    border: 1px solid rgba(125, 211, 252, 0.3);
    border-radius: 12px;
    padding: 16px;
    position: relative;
  }

  .post-author {
    font-size: 0.85rem;
    color: #7dd3fc;
    margin-bottom: 6px;
    font-weight: bold;
  }

  .post-card h3 {
    margin: 0 0 8px;
    font-size: 1.15rem;
    color: #ffffff;
  }

  .post-card p {
    margin: 0 0 14px;
    color: #e0f2fe;
    font-size: 0.95rem;
  }

  .post-img {
    width: 100%;
    max-height: 280px;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 12px;
    border: 1px solid rgba(125, 211, 252, 0.4);
  }

  .post-actions {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 12px;
  }

  .like-btn, .comment-toggle-btn {
    background: rgba(2, 132, 199, 0.5);
    border: 1px solid #7dd3fc;
    color: #ffffff;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.85rem;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .like-btn:hover, .comment-toggle-btn:hover {
    background: rgba(2, 132, 199, 0.8);
  }

  /* Sezione Commenti */
  .comments-section {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid rgba(125, 211, 252, 0.2);
    display: none;
  }

  .comment-item {
    background: rgba(12, 74, 110, 0.5);
    border-left: 3px solid #7dd3fc;
    padding: 8px 12px;
    border-radius: 4px;
    margin-bottom: 8px;
    font-size: 0.88rem;
    position: relative;
  }

  .comment-author {
    font-weight: bold;
    color: #bae6fd;
    font-size: 0.8rem;
  }

  .add-comment-box {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .add-comment-box input {
    flex: 1;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid #7dd3fc;
    outline: none;
    font-size: 0.85rem;
  }

  .add-comment-box button {
    padding: 6px 14px;
    border-radius: 999px;
    border: none;
    background: #0284c7;
    color: white;
    cursor: pointer;
    font-weight: bold;
    font-size: 0.85rem;
  }

  .back-container {
    text-align: center;
    margin-top: 10px;
    margin-bottom: 20px;
  }

  .btn {
    display: inline-block;
    padding: 10px 24px;
    color: #ffffff;
    font-weight: 600;
    text-decoration: none;
    border: 1px solid #7dd3fc;
    border-radius: 999px;
    background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
  }

  footer { 
    text-align: center; 
    color: #7dd3fc; 
    font-size: .9rem; 
    padding: 10px 0 30px; 
  }
</style>

<!-- Firebase SDKs Compat per Firestore -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

</head>
<body>
<div class="wrap">

  <header class="glass">
    <h1>Minecraft Community</h1>
    <p>Condividi idee, costruzioni e commenti con gli altri gamer.</p>
  </header>

  <div class="glass">

    <!-- Form creazione Post -->
    <div class="add-post-form">
      <input type="text" id="postTitle" class="input-field" placeholder="Titolo del post..." required>
      <textarea id="postContent" class="input-field" placeholder="Scrivi il tuo messaggio..." required></textarea>
      <input type="text" id="postImageUrl" class="input-field" placeholder="URL Immagine (opzionale, es: https://...)">
      <button class="submit-btn" onclick="createNewPost()">Pubblica Post</button>
    </div>

    <!-- Barra di ricerca -->
    <div class="search-container">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 Cerca nei post..." onkeyup="filterPosts()">
    </div>

    <!-- Lista post -->
    <div class="scroll-box" id="postsContainer">
      <p style="text-align:center;">Caricamento post da Firestore...</p>
    </div>
  </div>

  <div class="back-container">
    <a class="btn" href="index.html">Torna alla Home</a>
  </div>

  <footer>Giornale Dei Gamer · Tutti i diritti riservati</footer>

</div>

<script>
  // Configurazione Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyDSv5h11knmaS2CaJFTpgN6lTxEYptksRk",
    authDomain: "giornaledeigamer---social.firebaseapp.com",
    projectId: "giornaledeigamer---social",
    storageBucket: "giornaledeigamer---social.firebasestorage.app",
    messagingSenderId: "490970879261",
    appId: "1:490970879261:web:00bb9ace1800dd8dbe7df4",
    measurementId: "G-4K0NXCRDRL"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // UID di Admin con permessi di moderazione totale
  const SUPER_ADMIN_UID = "2NjFn7umG1RszA2dciMsr5H1f7z2";

  // Recupera l'utente attualmente loggato da localStorage
  function getLoggedUser() {
    return localStorage.getItem('gdg_logged_user');
  }

  // Controlla se l'utente corrente ha i permessi da Amministratore Supremo
  function isUserAdmin() {
    const loggedUser = getLoggedUser();
    if (!loggedUser) return false;

    // Recupera i dati utente registrati nel localStorage
    const userKey = 'gdg_user_' + loggedUser.toLowerCase();
    const userDataJson = localStorage.getItem(userKey);
    let userUid = '';
    
    if (userDataJson) {
      const userData = JSON.parse(userDataJson);
      userUid = userData.uid || '';
    }

    return (loggedUser.toLowerCase() === 'fronte') || (userUid === SUPER_ADMIN_UID);
  }

  // Ascolto in tempo reale dei post su Firestore
  db.collection('posts').onSnapshot((snapshot) => {
    const container = document.getElementById('postsContainer');
    container.innerHTML = '';

    if (snapshot.empty) {
      container.innerHTML = '<p style="text-align:center;">Nessun post presente. Creane uno tu!</p>';
      return;
    }

    const loggedUser = getLoggedUser();
    const likedPostsKey = loggedUser ? ('gdg_liked_posts_' + loggedUser) : '';
    const likedPosts = loggedUser ? (JSON.parse(localStorage.getItem(likedPostsKey)) || []) : [];
    const isAdmin = isUserAdmin();

    snapshot.forEach((doc) => {
      const post = doc.data();
      const postId = doc.id;

      const card = document.createElement('div');
      card.className = 'post-card';

      let imageHtml = '';
      if (post.imageUrl) {
        imageHtml = `<img class="post-img" src="${post.imageUrl}" alt="Immagine post" onerror="this.style.display='none'">`;
      }

      const commentsCount = post.comments ? post.comments.length : 0;
      const hasLiked = likedPosts.includes(postId);
      const likeBtnStyle = hasLiked 
        ? "background: rgba(56, 189, 248, 0.85); border-color: #ffffff;" 
        : "background: rgba(2, 132, 199, 0.5);";

      // Mostra il tasto elimina se l'utente è l'autore O se è Admin (Fronte / UID Admin)
      let deletePostBtn = '';
      if (loggedUser && (loggedUser === post.author || isAdmin)) {
        deletePostBtn = `<button onclick="deletePost('${postId}')" style="background: rgba(239,68,68,0.6); border: 1px solid #fca5a5; color: white; padding: 4px 10px; border-radius: 6px; cursor: pointer; float: right; font-size: 0.8rem;">🗑️ Elimina Post</button>`;
      }

      card.innerHTML = `
        ${deletePostBtn}
        <div class="post-author">👤 ${post.author || 'Anonimo'}</div>
        <h3>${post.title}</h3>
        ${imageHtml}
        <p>${post.content}</p>

        <div class="post-actions">
          <button class="like-btn" style="${likeBtnStyle}" onclick="addLike('${postId}', ${post.likes || 0})">
            👍 <span>${post.likes || 0}</span>
          </button>
          <button class="comment-toggle-btn" onclick="toggleComments('${postId}')">
            💬 Commenti (<span>${commentsCount}</span>)
          </button>
        </div>

        <!-- Sezione Commenti -->
        <div class="comments-section" id="comments-${postId}">
          <div id="commentList-${postId}">
            ${renderComments(post.comments || [], postId, loggedUser, isAdmin)}
          </div>
          <div class="add-comment-box">
            <input type="text" id="inputComment-${postId}" placeholder="Scrivi un commento...">
            <button onclick="addComment('${postId}')">Invia</button>
          </div>
        </div>
      `;

      container.appendChild(card);
    });
  });

  // Renderizza i commenti e gestisce i permessi di eliminazione
  function renderComments(comments, postId, loggedUser, isAdmin) {
    if (comments.length === 0) {
      return '<p style="font-size:0.8rem; color:#bae6fd; margin:4px 0;">Nessun commento ancora.</p>';
    }
    
    return comments.map((c, index) => {
      let deleteCommentBtn = '';
      if (loggedUser && (loggedUser === c.author || isAdmin)) {
        deleteCommentBtn = `<button onclick="deleteComment('${postId}', ${index})" style="background: none; border: none; color: #fca5a5; cursor: pointer; font-size: 0.8rem; float: right;" title="Elimina commento">❌</button>`;
      }

      return `
        <div class="comment-item">
          ${deleteCommentBtn}
          <div class="comment-author">${c.author}</div>
          <div>${c.text}</div>
        </div>
      `;
    }).join('');
  }

  // Pubblica un nuovo post
  async function createNewPost() {
    const author = getLoggedUser();
    if (!author) {
      alert("Devi prima accedere con il tuo account per pubblicare un post!");
      window.location.href = "account.html";
      return;
    }

    const title = document.getElementById('postTitle').value.trim();
    const content = document.getElementById('postContent').value.trim();
    const imageUrl = document.getElementById('postImageUrl').value.trim();

    if (!title || !content) {
      alert("Inserisci sia il titolo che il testo del post!");
      return;
    }

    try {
      await db.collection('posts').add({
        title: title,
        content: content,
        imageUrl: imageUrl,
        author: author,
        likes: 0,
        comments: [],
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });

      document.getElementById('postTitle').value = '';
      document.getElementById('postContent').value = '';
      document.getElementById('postImageUrl').value = '';
    } catch (e) {
      console.error("Errore durante l'invio del post: ", e);
      alert("Errore durante la pubblicazione.");
    }
  }

  // Sistema di Like intelligente (Metti / Togli Mi Piace)
  async function addLike(postId, currentLikes) {
    const loggedUser = getLoggedUser();
    if (!loggedUser) {
      alert("Devi accedere con il tuo account per mettere un like!");
      window.location.href = "account.html";
      return;
    }

    const likedPostsKey = 'gdg_liked_posts_' + loggedUser;
    let likedPosts = JSON.parse(localStorage.getItem(likedPostsKey)) || [];
    const postRef = db.collection('posts').doc(postId);

    try {
      if (likedPosts.includes(postId)) {
        likedPosts = likedPosts.filter(id => id !== postId);
        const newLikes = Math.max(0, currentLikes - 1);
        await postRef.update({ likes: newLikes });
      } else {
        likedPosts.push(postId);
        const newLikes = currentLikes + 1;
        await postRef.update({ likes: newLikes });
      }

      localStorage.setItem(likedPostsKey, JSON.stringify(likedPosts));
    } catch (e) {
      console.error("Errore durante la gestione del like:", e);
    }
  }

  // Mostra / Nasconde la sezione commenti
  function toggleComments(postId) {
    const el = document.getElementById(`comments-${postId}`);
    if (el.style.display === 'block') {
      el.style.display = 'none';
    } else {
      el.style.display = 'block';
    }
  }

  // Aggiunge un commento al post su Firestore
  async function addComment(postId) {
    const author = getLoggedUser();
    if (!author) {
      alert("Devi accedere per poter commentare!");
      window.location.href = "account.html";
      return;
    }

    const input = document.getElementById(`inputComment-${postId}`);
    const text = input.value.trim();

    if (!text) return;

    try {
      const postRef = db.collection('posts').doc(postId);
      const doc = await postRef.get();

      if (doc.exists) {
        const currentComments = doc.data().comments || [];
        currentComments.push({
          author: author,
          text: text,
          date: new Date().toISOString()
        });

        await postRef.update({ comments: currentComments });
        input.value = '';
      }
    } catch (e) {
      console.error("Errore inserimento commento: ", e);
    }
  }

  // Funzione sicura per eliminare un intero post
  async function deletePost(postId) {
    const loggedUser = getLoggedUser();
    if (!loggedUser) {
      alert("Devi effettuare l'accesso!");
      return;
    }

    try {
      const postRef = db.collection('posts').doc(postId);
      const doc = await postRef.get();

      if (!doc.exists) {
        alert("Il post non esiste.");
        return;
      }

      const postData = doc.data();
      const isAuthor = postData.author === loggedUser;
      const isAdmin = isUserAdmin();

      if (!isAuthor && !isAdmin) {
        alert("Non sei autorizzato a eliminare questo post!");
        return;
      }

      if (!confirm("Sei sicuro di voler eliminare questo post?")) return;

      await postRef.delete();
    } catch (e) {
      console.error("Errore durante l'eliminazione del post:", e);
      alert("Impossibile eliminare il post.");
    }
  }

  // Funzione sicura per eliminare un singolo commento
  async function deleteComment(postId, commentIndex) {
    const loggedUser = getLoggedUser();
    if (!loggedUser) {
      alert("Devi effettuare l'accesso!");
      return;
    }

    try {
      const postRef = db.collection('posts').doc(postId);
      const doc = await postRef.get();

      if (!doc.exists) return;

      let comments = doc.data().comments || [];
      const targetComment = comments[commentIndex];

      if (!targetComment) return;

      const isCommentAuthor = targetComment.author === loggedUser;
      const isAdmin = isUserAdmin();

      if (!isCommentAuthor && !isAdmin) {
        alert("Non sei autorizzato a eliminare questo commento!");
        return;
      }

      if (!confirm("Vuoi eliminare questo commento?")) return;

      comments.splice(commentIndex, 1);
      await postRef.update({ comments: comments });
    } catch (e) {
      console.error("Errore durante l'eliminazione del commento:", e);
      alert("Impossibile eliminare il commento.");
    }
  }

  // Filtro ricerca
  function filterPosts() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const posts = document.querySelectorAll('.post-card');

    posts.forEach(post => {
      const text = post.textContent.toLowerCase();
      if (text.includes(query)) {
        post.style.display = 'block';
      } else {
        post.style.display = 'none';
      }
    });
  }
</script>

</body>
</html>
