<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minecraft Community · Giornale Dei Gamer</title>
<link rel="icon" href="logo2.jpg">
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: #e0f2fe;
    line-height: 1.6;
    overflow-x: hidden;
    background: url('img/sfondominecraft1.png') no-repeat center center fixed;
    background-size: cover;
    background-color: #0c4a6e;
  }

  .wrap { 
    width: 100%; 
    max-width: 760px; 
    margin: 0 auto; 
    padding: 18px; 
  }

  .glass {
    background: rgba(12, 74, 110, 0.65);
    border: 1px solid rgba(125, 211, 252, 0.45);
    border-radius: 16px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(224, 242, 254, 0.5);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    padding: 20px;
    margin-bottom: 18px;
  }

  header.glass { 
    margin-top: 24px; 
    text-align: center; 
    padding: 30px 20px; 
  }

  h1 {
    margin: 0 0 10px;
    font-size: clamp(1.8rem, 7vw, 2.8rem);
    line-height: 1.1;
    color: #ffffff;
    text-shadow: 0 0 16px rgba(56, 189, 248, 0.9), 0 2px 4px rgba(0, 0, 0, 0.8);
  }

  header p { 
    margin: 0; 
    color: #bae6fd; 
    font-size: 1.05rem; 
  }

  /* Form creazione Post */
  .add-post-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(125, 211, 252, 0.3);
  }

  .input-field {
    width: 100%;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid #ffffff;
    background: rgba(255, 255, 255, 0.9);
    color: #0f172a;
    font-size: 0.95rem;
    outline: none;
  }

  textarea.input-field {
    resize: vertical;
    min-height: 70px;
  }

  .file-input {
    color: #e0f2fe;
    font-size: 0.9rem;
  }

  .submit-btn {
    align-self: flex-start;
    padding: 8px 20px;
    border-radius: 999px;
    border: 1px solid #7dd3fc;
    background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
    color: white;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    transition: all 0.2s ease;
  }

  .submit-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 14px rgba(56, 189, 248, 0.7);
  }

  .search-container {
    margin-bottom: 16px;
  }

  .search-input {
    width: 100%;
    padding: 12px 18px;
    border-radius: 999px;
    border: 1px solid #ffffff;
    background: #ffffff;
    color: #0f172a;
    font-size: 0.95rem;
    outline: none;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
  }

  .scroll-box {
    max-height: 450px;
    overflow-y: auto;
    padding-right: 6px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .post-card {
    background: rgba(7, 59, 92, 0.75);
    border: 1px solid rgba(125, 211, 252, 0.3);
    border-radius: 12px;
    padding: 16px;
  }

  .post-card h3 {
    margin: 0 0 8px;
    font-size: 1.15rem;
    color: #ffffff;
  }

  .post-card p {
    margin: 0 0 14px;
    color: #e0f2fe;
    font-size: 0.95rem;
  }

  .post-img {
    width: 100%;
    max-height: 250px;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 12px;
    border: 1px solid rgba(125, 211, 252, 0.4);
  }

  .like-btn {
    background: rgba(2, 132, 199, 0.5);
    border: 1px solid #7dd3fc;
    color: #ffffff;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.9rem;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .back-container {
    text-align: center;
    margin-top: 10px;
    margin-bottom: 20px;
  }

  .btn {
    display: inline-block;
    padding: 10px 24px;
    color: #ffffff;
    font-weight: 600;
    text-decoration: none;
    border: 1px solid #7dd3fc;
    border-radius: 999px;
    background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
  }

  footer { 
    text-align: center; 
    color: #7dd3fc; 
    font-size: .9rem; 
    padding: 10px 0 30px; 
  }
</style>

<!-- Firebase SDKs (Compat version per HTML) -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>

</head>
<body>
<div class="wrap">

  <header class="glass">
    <h1>Minecraft Community</h1>
    <p>Condividi pensieri, idee e immagini sul mondo dei cubi.</p>
  </header>

  <div class="glass">

    <!-- Form creazione Post -->
    <div class="add-post-form">
      <input type="text" id="postTitle" class="input-field" placeholder="Titolo del post..." required>
      <textarea id="postContent" class="input-field" placeholder="Scrivi il tuo messaggio..." required></textarea>
      <input type="file" id="postImage" class="file-input" accept="image/*">
      <button class="submit-btn" onclick="createNewPost()">Pubblica Post</button>
    </div>

    <!-- Barra di ricerca -->
    <div class="search-container">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 Cerca nei post..." onkeyup="filterPosts()">
    </div>

    <!-- Lista post -->
    <div class="scroll-box" id="postsContainer">
      <p style="text-align:center;">Caricamento post...</p>
    </div>
  </div>

  <div class="back-container">
    <a class="btn" href="index.html">Torna alla Home</a>
  </div>

  <footer>Giornale Dei Gamer · Tutti i diritti riservati</footer>

</div>

<script>
  // La tua configurazione esatta di Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyDSv5h11knmaS2CaJFTpgN6lTxEYptksRk",
    authDomain: "giornaledeigamer---social.firebaseapp.com",
    projectId: "giornaledeigamer---social",
    storageBucket: "giornaledeigamer---social.firebasestorage.app",
    messagingSenderId: "490970879261",
    appId: "1:490970879261:web:00bb9ace1800dd8dbe7df4",
    measurementId: "G-4K0NXCRDRL",
    databaseURL: "https://giornaledeigamer---social-default-rtdb.europe-west1.firebasedatabase.app" // Inserisci qui l'URL del tuo Realtime Database se lo crei
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const storage = firebase.storage();

  // Caricamento in tempo reale dei post dal database
  db.ref('posts').on('value', (snapshot) => {
    const container = document.getElementById('postsContainer');
    container.innerHTML = '';

    const data = snapshot.val();
    if (!data) {
      container.innerHTML = '<p style="text-align:center;">Nessun post presente. Creane uno tu!</p>';
      return;
    }

    Object.keys(data).reverse().forEach(postId => {
      const post = data[postId];
      
      const card = document.createElement('div');
      card.className = 'post-card';

      let imageHtml = '';
      if (post.imageUrl) {
        imageHtml = `<img class="post-img" src="${post.imageUrl}" alt="Immagine post">`;
      }

      card.innerHTML = `
        <h3>${post.title}</h3>
        ${imageHtml}
        <p>${post.content}</p>
        <button class="like-btn" onclick="incrementLike('${postId}')">
          👍 <span class="like-count">${post.likes || 0}</span>
        </button>
      `;

      container.appendChild(card);
    });
  });

  // Funzione per pubblicare un post
  async function createNewPost() {
    const title = document.getElementById('postTitle').value.trim();
    const content = document.getElementById('postContent').value.trim();
    const imageFile = document.getElementById('postImage').files[0];

    if (!title || !content) {
      alert("Compila titolo e testo!");
      return;
    }

    let imageUrl = "";

    if (imageFile) {
      const storageRef = storage.ref(`posts_images/${Date.now()}_${imageFile.name}`);
      const uploadTask = await storageRef.put(imageFile);
      imageUrl = await uploadTask.ref.getDownloadURL();
    }

    const newPostRef = db.ref('posts').push();
    await newPostRef.set({
      title: title,
      content: content,
      imageUrl: imageUrl,
      likes: 0,
      timestamp: Date.now()
    });

    document.getElementById('postTitle').value = '';
    document.getElementById('postContent').value = '';
    document.getElementById('postImage').value = '';
  }

  // Funzione per mettere like
  function incrementLike(postId) {
    db.ref(`posts/${postId}/likes`).transaction((currentLikes) => {
      return (currentLikes || 0) + 1;
    });
  }

  // Filtro ricerca
  function filterPosts() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const posts = document.querySelectorAll('.post-card');

    posts.forEach(post => {
      const title = post.querySelector('h3').textContent.toLowerCase();
      const content = post.querySelector('p').textContent.toLowerCase();

      if (title.includes(query) || content.includes(query)) {
        post.style.display = 'block';
      } else {
        post.style.display = 'none';
      }
    });
  }
</script>

</body>
</html>
